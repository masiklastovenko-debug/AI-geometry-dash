<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Geometry Dash - Airplane, Rotate & Localization</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            text-align: center;
        }
        canvas {
            background: linear-gradient(to bottom, #1e1e3f, #0f0f1f);
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: block;
            margin: 0 auto 10px auto;
        }
        .ui-panel {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button, select {
            background-color: #222;
            color: #fff;
            border: 2px solid #555;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover, select:hover {
            background-color: #444;
            border-color: #777;
        }
        button.active {
            background-color: #ff8c00;
            border-color: #ffa500;
            color: #000;
            font-weight: bold;
        }
        .info {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="ui-panel">
        <button id="btnPlay" onclick="togglePlay()">▶ Играть</button>
        <button id="btnAI" onclick="toggleAI()">🤖 AI: ВКЛ</button>
        <button id="btnEditor" onclick="toggleEditor()">✏️ Редактор: ВЫКЛ</button>
        <button id="btnLang" onclick="toggleLanguage()">🌐 RU / EN</button>
        <button onclick="resetLevel()" id="btnReset">🔄 Сбросить</button>
    </div>

    <div class="ui-panel" id="editorTools" style="display: none;">
        <span id="toolLabelText">Инструмент:</span>
        <select id="toolSelect">
            <option value="block" data-ru="Блок" data-en="Block">Блок</option>
            <option value="spike" data-ru="Шип" data-en="Spike">Шип</option>
            <option value="orb" data-ru="Прыжковая сфера" data-en="Jump Orb">Прыжковая сфера</option>
            <option value="pad" data-ru="Батут" data-en="Jump Pad">Батут</option>
            <option value="airplanePortal" data-ru="Портал Самолётика" data-en="Airplane Portal">Портал Самолётика</option>
        </select>
        <button onclick="rotateToolObject()">🔄 <span id="rotText">Поворот</span>: <span id="rotLabel">0°</span></button>
        <button onclick="clearLevel()" id="btnClear" style="background-color: #8b0000;">🗑 Очистить</button>
    </div>

    <div class="info" id="infoText">Пробел / Клик — Прыжок / Смена полосы Самолётика. В редакторе: ЛКМ — поставить, ПКМ — удалить.</div>
</div>

<script>
    // Словарь локализации
    let currentLang = "ru"; // "ru" или "en"
    const langData = {
        ru: {
            play: "▶ Играть",
            pause: "⏸ Пауза",
            aiOn: "🤖 AI Автопилот: ВКЛ",
            aiOff: "🤖 AI Автопилот: ВЫКЛ",
            editorOn: "✏️ Редактор: ВКЛ",
            editorOff: "✏️ Редактор: ВЫКЛ",
            reset: "🔄 Сбросить",
            toolLabel: "Инструмент:",
            rotBtn: "Поворот",
            clear: "🗑 Очистить",
            info: "Пробел / Клик — Прыжок / Смена полосы Самолётика. В редакторе: ЛКМ — поставить / удалить."
        },
        en: {
            play: "▶ Play",
            pause: "⏸ Pause",
            aiOn: "🤖 AI Autopilot: ON",
            aiOff: "🤖 AI Autopilot: OFF",
            editorOn: "✏️ Editor: ON",
            editorOff: "✏️ Editor: OFF",
            reset: "🔄 Reset",
            toolLabel: "Tool:",
            rotBtn: "Rotate",
            clear: "🗑 Clear",
            info: "Space / Click — Jump / Airplane Lane Switch. In Editor: LMB — place / remove."
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === "ru" ? "en" : "ru";
        updateTexts();
    }

    function updateTexts() {
        const l = langData[currentLang];
        document.getElementById("btnPlay").innerText = isPlaying ? l.pause : l.play;
        document.getElementById("btnAI").innerText = isAI ? l.aiOn : l.aiOff;
        document.getElementById("btnEditor").innerText = isEditor ? l.editorOn : l.editorOff;
        document.getElementById("btnReset").innerText = l.reset;
        document.getElementById("toolLabelText").innerText = l.toolLabel;
        document.getElementById("rotText").innerText = l.rotBtn;
        document.getElementById("btnClear").innerText = l.clear;
        document.getElementById("infoText").innerText = l.info;

        // Обновляем текст в выпадающем списке
        const select = document.getElementById("toolSelect");
        for (let opt of select.options) {
            opt.text = opt.getAttribute(`data-${currentLang}`);
        }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isPlaying = false;
    let isAI = true;
    let isEditor = false;
    let currentRotation = 0; // 0, 90, 180, 270

    let player = {
        x: 100,
        y: 300,
        size: 30,
        vy: 0,
        onGround: false,
        mode: "cube",
        airplaneLane: 0
    };

    const groundY = 330;
    const gravity = 0.8;
    const jumpForce = -12;
    let cameraX = 0;
    let gameSpeed = 5;

    let levelObjects = [
        { x: 400, y: 300, type: "block", rotation: 0 },
        { x: 600, y: 300, type: "spike", rotation: 0 },
        { x: 800, y: 250, type: "orb", rotation: 0 },
        { x: 1100, y: 300, type: "airplanePortal", rotation: 0 },
        { x: 1300, y: 300, type: "spike", rotation: 0 }
    ];

    function togglePlay() {
        isPlaying = !isPlaying;
        updateTexts();
        document.getElementById("btnPlay").classList.toggle("active", isPlaying);
    }

    function toggleAI() {
        isAI = !isAI;
        updateTexts();
        document.getElementById("btnAI").classList.toggle("active", isAI);
    }

    function toggleEditor() {
        isEditor = !isEditor;
        updateTexts();
        document.getElementById("btnEditor").classList.toggle("active", isEditor);
        document.getElementById("editorTools").style.display = isEditor ? "flex" : "none";
        if (isEditor) isPlaying = false;
    }

    function rotateToolObject() {
        currentRotation = (currentRotation + 90) % 360;
        document.getElementById("rotLabel").innerText = currentRotation + "°";
    }

    function resetLevel() {
        player.x = 100;
        player.y = 300;
        player.vy = 0;
        player.onGround = false;
        player.mode = "cube";
        player.airplaneLane = 0;
        cameraX = 0;
    }

    function clearLevel() {
        levelObjects = [];
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            e.preventDefault();
            handleAction();
        }
    });

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left + cameraX;
        const mouseY = e.clientY - rect.top;

        if (isEditor) {
            const gridX = Math.floor(mouseX / 30) * 30;
            const gridY = Math.floor(mouseY / 30) * 30;

            const existingIndex = levelObjects.findIndex(obj => Math.abs(obj.x - gridX) < 15 && Math.abs(obj.y - gridY) < 15);
            if (existingIndex !== -1) {
                levelObjects.splice(existingIndex, 1);
            } else {
                const tool = document.getElementById("toolSelect").value;
                levelObjects.push({ x: gridX, y: gridY, type: tool, rotation: currentRotation });
            }
        } else {
            handleAction();
        }
    });

    function handleAction() {
        if (!isPlaying && !isEditor) togglePlay();

        if (player.mode === "cube" && player.onGround) {
            player.vy = jumpForce;
            player.onGround = false;
        } else if (player.mode === "airplane") {
            player.airplaneLane = (player.airplaneLane + 1) % 3;
        }
    }

    function runAI() {
        if (!isAI || isEditor) return;

        if (player.mode === "cube") {
            let needJump = false;
            for (let obj of levelObjects) {
                if (obj.type === "spike" && obj.rotation === 0) {
                    if (obj.x > player.x && obj.x - player.x < 85 && player.onGround) {
                        needJump = true;
                    }
                }
            }
            if (needJump && player.onGround) {
                player.vy = jumpForce;
                player.onGround = false;
            }
        } else if (player.mode === "airplane") {
            let danger = false;
            for (let obj of levelObjects) {
                if (obj.x > player.x && obj.x - player.x < 120) {
                    let objLane = Math.round((groundY - obj.y) / 60);
                    if (objLane === player.airplaneLane && (obj.type === "spike" || obj.type === "block")) {
                        danger = true;
                    }
                }
            }
            if (danger) {
                player.airplaneLane = (player.airplaneLane + 1) % 3;
            }
        }
    }

    function update() {
        if (isPlaying && !isEditor) {
            runAI();

            if (player.mode === "cube") {
                player.vy += gravity;
                player.y += player.vy;

                if (player.y >= groundY - player.size) {
                    player.y = groundY - player.size;
                    player.vy = 0;
                    player.onGround = true;
                }
            } else if (player.mode === "airplane") {
                let targetY = groundY - player.size - (player.airplaneLane * 60);
                player.y += (targetY - player.y) * 0.2;
                player.vy = 0;
                player.onGround = false;
            }

            cameraX += gameSpeed;

            for (let obj of levelObjects) {
                if (Math.abs(player.x - obj.x) < 25 && Math.abs(player.y - obj.y) < 25) {
                    if (obj.type === "spike") {
                        resetLevel();
                    } else if (obj.type === "airplanePortal") {
                        player.mode = "airplane";
                        player.airplaneLane = 0;
                    } else if (obj.type === "orb") {
                        player.vy = jumpForce * 1.1;
                    } else if (obj.type === "pad") {
                        player.vy = jumpForce * 1.3;
                    }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        if (isEditor) {
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x < cameraX + canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, groundY);
                ctx.stroke();
            }
            for (let y = 0; y < groundY; y += 60) {
                ctx.strokeStyle = "rgba(255,140,0,0.1)";
                ctx.beginPath();
                ctx.moveTo(cameraX, y);
                ctx.lineTo(cameraX + canvas.width, y);
                ctx.stroke();
            }
        }

        ctx.fillStyle = "#222244";
        ctx.fillRect(cameraX, groundY, canvas.width, canvas.height - groundY);
        ctx.fillStyle = "#ff8c00";
        ctx.fillRect(cameraX, groundY, canvas.width, 4);

        if (player.mode === "airplane") {
            ctx.strokeStyle = "rgba(255, 140, 0, 0.2)";
            ctx.setLineDash([5, 5]);
            for (let i = 0; i < 3; i++) {
                let laneY = groundY - (i * 60);
                ctx.beginPath();
                ctx.moveTo(cameraX, laneY);
                ctx.lineTo(cameraX + canvas.width, laneY);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        for (let obj of levelObjects) {
            ctx.save();
            ctx.translate(obj.x + 15, obj.y + 15);
            ctx.rotate((obj.rotation * Math.PI) / 180);

            if (obj.type === "block") {
                ctx.fillStyle = "#4a4ae2";
                ctx.fillRect(-15, -15, 30, 30);
                ctx.strokeStyle = "#fff";
                ctx.strokeRect(-15, -15, 30, 30);
            } else if (obj.type === "spike") {
                ctx.fillStyle = "#ff3333";
                ctx.beginPath();
                ctx.moveTo(0, -15);
                ctx.lineTo(15, 15);
                ctx.lineTo(-15, 15);
                ctx.closePath();
                ctx.fill();
            } else if (obj.type === "orb") {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            } else if (obj.type === "pad") {
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(-15, 5, 30, 10);
            } else if (obj.type === "airplanePortal") {
                ctx.fillStyle = "#ff8c00";
                ctx.fillRect(-8, -25, 16, 50);
                ctx.fillStyle = "#fff";
                ctx.font = "10px Arial";
                ctx.fillText("AIR", -10, 0);
            }
            ctx.restore();
        }

        if (player.mode === "cube") {
            ctx.fillStyle = "#00ffcc";
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = "#000";
            ctx.strokeRect(player.x, player.y, player.size, player.size);
        } else {
            ctx.fillStyle = "#ff8c00";
            ctx.beginPath();
            ctx.moveTo(player.x - 5, player.y + 15);
            ctx.lineTo(player.x + 35, player.y + 15);
            ctx.lineTo(player.x + 15, player.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
        }

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
