<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Classic Stable</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            text-align: center;
            background: rgba(20, 20, 35, 0.8);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(74, 74, 226, 0.2);
            border: 2px solid #2a2a4e;
        }
        canvas {
            background: linear-gradient(to bottom, #1e1e3f, #0f0f1f);
            border: 3px solid #ff8c00;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
            display: block;
            margin: 0 auto 15px auto;
        }
        .ui-panel {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button, select {
            background: linear-gradient(to bottom, #2a2a4e, #1a1a3e);
            color: #fff;
            border: 2px solid #4a4ae2;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover, select:hover {
            background: linear-gradient(to bottom, #3a3a6e, #2a2a4e);
            border-color: #ff8c00;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            transform: translateY(-2px);
        }
        button.active {
            background: linear-gradient(to bottom, #ff8c00, #e07000);
            border-color: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
        }
        select {
            padding: 8px 12px;
        }
        .info {
            font-size: 13px;
            color: #b8b8d0;
            margin-top: 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="ui-panel">
        <button id="btnPlay" onclick="togglePlay()">▶ Играть</button>
        <button id="btnAI" onclick="toggleAI()">🤖 AI: ВКЛ</button>
        <button id="btnEditor" onclick="toggleEditor()">✏️ Редактор: ВЫКЛ</button>
        <button onclick="resetLevel()">🔄 Сбросить</button>
    </div>

    <div class="ui-panel" id="editorTools" style="display: none;">
        <span>Инструмент:</span>
        <select id="toolSelect">
            <option value="block">Блок</option>
            <option value="spike">Шип</option>
            <option value="orb">Прыжковая сфера</option>
            <option value="pad">Батут</option>
        </select>
        <button onclick="clearLevel()" style="background: linear-gradient(to bottom, #8b0000, #500000); border-color: #ff3333;">🗑 Очистить</button>
    </div>

    <div class="info">Пробел / Клик — Прыжок. В редакторе: ЛКМ — поставить, ПКМ — удалить объект.</div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let isPlaying = false;
    let isAI = true;
    let isEditor = false;

    let player = {
        x: 100,
        y: 300,
        size: 30,
        vy: 0,
        onGround: false
    };

    const groundY = 330;
    const gravity = 0.8;
    const jumpForce = -12;
    let cameraX = 0;
    let gameSpeed = 5;

    let levelObjects = [
        { x: 400, y: 300, type: "block" },
        { x: 600, y: 300, type: "spike" },
        { x: 800, y: 250, type: "orb" },
        { x: 1000, y: 310, type: "pad" },
        { x: 1300, y: 300, type: "spike" }
    ];

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById("btnPlay").innerText = isPlaying ? "⏸ Пауза" : "▶ Играть";
        document.getElementById("btnPlay").classList.toggle("active", isPlaying);
    }

    function toggleAI() {
        isAI = !isAI;
        const btn = document.getElementById("btnAI");
        btn.innerText = `🤖 AI: ${isAI ? "ВКЛ" : "ВЫКЛ"}`;
        btn.classList.toggle("active", isAI);
    }

    function toggleEditor() {
        isEditor = !isEditor;
        document.getElementById("btnEditor").innerText = `✏️ Редактор: ${isEditor ? "ВКЛ" : "ВЫКЛ"}`;
        document.getElementById("btnEditor").classList.toggle("active", isEditor);
        document.getElementById("editorTools").style.display = isEditor ? "flex" : "none";
        if (isEditor) isPlaying = false;
    }

    function resetLevel() {
        player.x = 100;
        player.y = 300;
        player.vy = 0;
        player.onGround = false;
        cameraX = 0;
    }

    function clearLevel() {
        levelObjects = [];
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            e.preventDefault();
            handleAction();
        }
    });

    canvas.addEventListener("click", (e) => {
        if (isEditor) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left + cameraX;
            const mouseY = e.clientY - rect.top;
            const gridX = Math.floor(mouseX / 30) * 30;
            const gridY = Math.floor(mouseY / 30) * 30;

            const tool = document.getElementById("toolSelect").value;
            levelObjects.push({ x: gridX, y: gridY, type: tool });
        } else {
            handleAction();
        }
    });

    canvas.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        if (isEditor) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left + cameraX;
            const mouseY = e.clientY - rect.top;

            const existingIndex = levelObjects.findIndex(obj => 
                mouseX >= obj.x && mouseX <= obj.x + 30 && mouseY >= obj.y && mouseY <= obj.y + 30
            );
            if (existingIndex !== -1) {
                levelObjects.splice(existingIndex, 1);
            }
        }
    });

    function handleAction() {
        if (!isPlaying && !isEditor) togglePlay();
        if (player.onGround) {
            player.vy = jumpForce;
            player.onGround = false;
        }
    }

    function runAI() {
        if (!isAI || isEditor) return;
        let needJump = false;
        for (let obj of levelObjects) {
            if (obj.type === "spike") {
                if (obj.x > player.x && obj.x - player.x < 85 && player.onGround) {
                    needJump = true;
                }
            }
        }
        if (needJump && player.onGround) {
            player.vy = jumpForce;
            player.onGround = false;
        }
    }

    function update() {
        if (isPlaying && !isEditor) {
            runAI();

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= groundY - player.size) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.onGround = true;
            }

            cameraX += gameSpeed;

            for (let obj of levelObjects) {
                if (Math.abs(player.x - obj.x) < 25 && Math.abs(player.y - obj.y) < 25) {
                    if (obj.type === "spike") {
                        resetLevel();
                    } else if (obj.type === "orb") {
                        player.vy = jumpForce * 1.1;
                    } else if (obj.type === "pad") {
                        player.vy = jumpForce * 1.3;
                    }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        if (isEditor) {
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x < cameraX + canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, groundY);
                ctx.stroke();
            }
        }

        ctx.fillStyle = "#16162c";
        ctx.fillRect(cameraX, groundY, canvas.width, canvas.height - groundY);
        ctx.fillStyle = "#ff8c00";
        ctx.fillRect(cameraX, groundY, canvas.width, 4);

        for (let obj of levelObjects) {
            if (obj.type === "block") {
                ctx.fillStyle = "#4a4ae2";
                ctx.fillRect(obj.x, obj.y, 30, 30);
                ctx.strokeStyle = "#fff";
                ctx.strokeRect(obj.x, obj.y, 30, 30);
            } else if (obj.type === "spike") {
                ctx.fillStyle = "#ff3333";
                ctx.beginPath();
                ctx.moveTo(obj.x + 15, obj.y);
                ctx.lineTo(obj.x + 30, obj.y + 30);
                ctx.lineTo(obj.x, obj.y + 30);
                ctx.closePath();
                ctx.fill();
            } else if (obj.type === "orb") {
                ctx.fillStyle = "#ff00ff";
                ctx.beginPath();
                ctx.arc(obj.x + 15, obj.y + 15, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            } else if (obj.type === "pad") {
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(obj.x, obj.y + 20, 30, 10);
            }
        }

        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(player.x, player.y, player.size, player.size);
        ctx.strokeStyle = "#000";
        ctx.strokeRect(player.x, player.y, player.size, player.size);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
